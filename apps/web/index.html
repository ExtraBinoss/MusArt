<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="theme-color" content="#8B5CF6" />
    <link rel="icon" type="image/svg+xml" href="/branding/melt.svg?v=969a72c17891" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/melt-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Melt — an open-source creative studio for images, typography and GPU effects."
    />
    <title>Melt</title>
    <script>
      try {
        const t = localStorage.getItem("musart.theme") || "system";
        const d =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
